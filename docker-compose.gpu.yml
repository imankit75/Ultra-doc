# =============================================================
# Ultra Doc-Intelligence — GPU Docker Compose (NVIDIA CUDA)
# Requirements: NVIDIA GPU + nvidia-container-toolkit on host
# Usage: docker compose -f docker-compose.gpu.yml up --build
# =============================================================

services:
  ultra-doc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_GPU: "true"        # CUDA build
    image: ultra-doc:gpu
    container_name: ultra-doc-gpu
    ports:
      - "7860:7860"
    volumes:
      - ./models:/app/models:ro   # GGUF model (read-only)
      - ./uploads:/app/uploads    # Uploaded documents
      - ./chroma_db:/app/chroma_db  # Vector store
    environment:
      - N_GPU_LAYERS=-1           # Offload ALL layers to GPU
      - KMP_DUPLICATE_LIB_OK=TRUE
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
