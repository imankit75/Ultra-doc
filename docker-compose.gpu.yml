# =============================================================
# Ultra Doc-Intelligence — GPU Docker Compose (NVIDIA)
# Requirements: NVIDIA GPU + nvidia-container-toolkit on host
# Usage: docker compose -f docker-compose.gpu.yml up --build
# =============================================================

services:
  ultra-doc:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: ultra-doc:gpu
    container_name: ultra-doc-gpu
    ports:
      - "7860:7860"
    volumes:
      # Model files (read-only, must be downloaded locally first)
      - ./models:/app/models:ro
      # Persistent storage
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
    environment:
      - N_GPU_LAYERS=-1       # Offload ALL layers to GPU
      - KMP_DUPLICATE_LIB_OK=TRUE
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
