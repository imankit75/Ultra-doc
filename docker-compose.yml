# =============================================================
# Ultra Doc-Intelligence — CPU Docker Compose
# Usage: docker compose up --build
# =============================================================

services:
  ultra-doc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_GPU: "false"       # CPU-only build
    image: ultra-doc:cpu
    container_name: ultra-doc
    ports:
      - "7860:7860"
    volumes:
      - ./models:/app/models:ro   # GGUF model (read-only)
      - ./uploads:/app/uploads    # Uploaded documents
      - ./chroma_db:/app/chroma_db  # Vector store
    environment:
      - N_GPU_LAYERS=0            # CPU only
      - KMP_DUPLICATE_LIB_OK=TRUE
    restart: unless-stopped
